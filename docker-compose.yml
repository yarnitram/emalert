services:
  radar:
    build: .
    environment:
      MEXC_REST_BASE_URL: https://api.mexc.com
      MEXC_FUTURES_WS_URL: wss://contract.mexc.com/edge
      EMALERT_DB_PATH: /data/ema_radar.sqlite3
    volumes:
      - radar-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  scanner:
    profiles: ["live"]
    build: .
    command: ["python", "-u", "-m", "app.live", "${EMALERT_SYMBOL:-BTC_USDT}", "${EMALERT_TICK_SIZE:-0.1}", "--timeframe", "${EMALERT_TIMEFRAME:-1m}", "--ema", "${EMALERT_EMA:-200}", "--continuous"]
    environment:
      EMALERT_WATCH: "${EMALERT_WATCH:-}"
      EMALERT_MARKET_TICKERS: "${EMALERT_MARKET_TICKERS:-0}"
      EMALERT_MARKET_LIMIT: "${EMALERT_MARKET_LIMIT:-20}"
      EMALERT_PRIORITY_TRADES: "${EMALERT_PRIORITY_TRADES:-}"
      EMALERT_DB_PATH: /data/ema_radar.sqlite3
    volumes:
      - radar-data:/data
    restart: unless-stopped
    stop_signal: SIGINT
volumes:
  radar-data:
